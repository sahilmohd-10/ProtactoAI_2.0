<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="18" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Industrial Safety Hex Shield -->
  <path d="M32 4L54 13V28C54 42.5 44.5 53.5 32 60C19.5 53.5 10 42.5 10 28V13L32 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#34D399" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Protective Shield Border -->
  <path d="M32 9L49 16.5V28C49 39.8 41.5 48.8 32 54.2C22.5 48.8 15 39.8 15 28V16.5L32 9Z" 
        fill="none" 
        stroke="#A7F3D0" 
        stroke-width="1.2" 
        stroke-opacity="0.4"/>

  <!-- AI Safety Eye / Checkmark Glyph -->
  <path d="M22 30.5L28.5 37L42 23.5" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Small AI Node Core -->
  <circle cx="32" cy="18" r="2.5" fill="#A7F3D0"/>
</svg>
